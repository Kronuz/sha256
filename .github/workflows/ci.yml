name: CI
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * *'  # nightly: flaky timing, and drift in libraries tracked at main
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    uses: Kronuz/cpp-libraries/.github/workflows/cmake.yml@main

  # Kernel coverage and throughput on each runner's real CPU: which kernels run,
  # and GB/s per kernel against OpenSSL EVP (Release build, one thread).
  bench:
    name: bench-${{ matrix.name }}
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-24.04 }
          - { name: linux-arm64, os: ubuntu-24.04-arm }
          - { name: macos-arm64, os: macos-15 }
          - { name: macos-x86_64, os: macos-15-intel }
    steps:
      - uses: actions/checkout@v5
      - name: CPU
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            lscpu
            grep -m1 -o -w -E 'sha_ni|sha2' /proc/cpuinfo || echo "no sha_ni/sha2 flag"
            dpkg -s libssl-dev >/dev/null 2>&1 || { sudo apt-get update -q && sudo apt-get install -y -q libssl-dev; }
          else
            sysctl -n machdep.cpu.brand_string
            sysctl -a | grep -i -E 'sha|leaf7' || true
          fi
      - name: Configure
        run: |
          if [ "$RUNNER_OS" = macOS ]; then export OPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"; fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSHA256_BUILD_BENCHMARKS=ON
      - name: Build
        run: cmake --build build --parallel 4
      - name: Kernel tests
        run: ./build/sha256_kernels_test
      - name: Benchmark
        run: ./build/sha256_bench | tee -a "$GITHUB_STEP_SUMMARY"
